name: Release

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: blg-linux-amd64
          - os: macos-latest
            artifact: blg-macos-universal
          - os: windows-latest
            artifact: blg-windows-amd64

    runs-on: ${{ matrix.os }}

    # git-bash on every runner: one shell for all platforms, and unlike
    # pwsh it propagates non-zero exit codes from native exes like nimble,
    # so a failed build/test actually fails the step.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: $HOME
          nim-install-directory: nim-toolchain

      - name: Install dependencies
        run: |
          nimble install -y --depsOnly
          nimble setup -y
          echo '--path:"src"' >> nimble.paths

      - name: Fetch CA bundle (macOS, Windows)
        # Release OpenSSL on mac/win can't find a trust store on user
        # systems; embed the CA bundle into the binary (-d:cacertBundle).
        if: runner.os != 'Linux'
        run: curl -fsSL -o assets/cacert.pem https://curl.se/ca/cacert.pem

      - name: Compute build flags
        run: |
          FLAGS="-d:release -d:Version=${GITHUB_REF_NAME:-dev}"
          if [[ "${RUNNER_OS}" != "Linux" ]]; then
            FLAGS="$FLAGS -d:cacertBundle"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # auto-update on in release binaries only; source builds
            # (nimble install) keep the default off
            FLAGS="$FLAGS -d:autoUpdate"
          fi
          echo "BUILD_FLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: Build
        run: nimble build -y ${{ env.BUILD_FLAGS }}

      - name: Build x86_64 and create universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mv blg blg-arm64
          rm -rf ~/.cache/nim/blg_r
          nim c ${{ env.BUILD_FLAGS }} --passC:"-arch x86_64" --passL:"-arch x86_64" --cpu:amd64 -o:blg-x86_64 src/blg.nim
          lipo -create blg-arm64 blg-x86_64 -output blg
          file blg

      - name: Run tests
        run: nimble test

      - name: Fetch OpenSSL DLLs (Windows)
        # Stock Windows ships no OpenSSL. Nim's std/net dlopens libssl /
        # libcrypto by hardcoded names; without these DLLs alongside
        # blg.exe, any TLS code path dies. The canonical Nim Windows DLL
        # bundle has them.
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o dlls.zip https://nim-lang.org/download/dlls.zip
          unzip -o -d dlls dlls.zip

      # Bare binaries as release assets; the CA bundle travels inside
      # the binary, so there is nothing else to ship.
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cp blg ${{ matrix.artifact }}
          ./${{ matrix.artifact }} -v

      - name: Package (Windows)
        # Zip: the exe can't update itself without the DLLs in place.
        if: runner.os == 'Windows'
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp blg.exe dlls/libssl-1_1-x64.dll dlls/libcrypto-1_1-x64.dll ${{ matrix.artifact }}/
          7z a ${{ matrix.artifact }}.zip ./${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            blg-linux-amd64 \
            blg-macos-universal \
            blg-windows-amd64.zip
